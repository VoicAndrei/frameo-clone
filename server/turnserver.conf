# ---------------------------------------------------------------------------
# frameo-clone coturn configuration  -- TEMPLATE
# ---------------------------------------------------------------------------
# This file is a TEMPLATE. The ${...} placeholders are substituted at deploy
# time by ./render-turnserver-conf.sh, which reads server/.env and writes the
# result to ${FRAMEO_ROOT}/config/turnserver.conf (mode 0600, owned by the deploy user).
# The container bind-mounts that whole directory read-only at /config and is
# started with `-c /config/turnserver.conf`.
# Never edit the rendered copy by hand: the next deploy overwrites it.
#
# Placeholders:
#   ${TS_TAILNET_IP}            this node's tailnet IPv4 (`tailscale ip -4`), 100.x.y.z
#   ${TURN_STATIC_AUTH_SECRET}  shared with the signalling server's identically named env var
#   ${TURN_REALM}               defaults to the node's MagicDNS name
#
# HOW THIS SERVER IS REACHED  (ARCHITECTURE-PUBLIC.md sections 3.1-3.4)
#
#   public phones  -> tailscale funnel --tls-terminated-tcp=10000 -> 127.0.0.1:3478 (plain TCP)
#   tailnet frames -> 100.x.y.z:3478 directly (UDP and TCP)
#
# tailscaled terminates TLS with the node's auto-renewing Let's Encrypt
# certificate, so coturn holds NO certificate and speaks NO TLS. That is why
# no-tls / no-dtls below are correct rather than a downgrade: the only way to
# reach 3478 from outside this machine is through the tailnet or through
# tailscaled's TLS ingress.
#
# The relay allocation trick: relay-ip is the TAILNET address, so a relayed
# candidate is 100.x.y.z:<port>. Neither party has to route to that address
# itself - each one's media rides the connection it already opened to this
# server. When a public phone and a frame both allocate here, the winning pair
# is relay-to-relay: coturn forwards between two of its own allocations, which
# is a local UDP hop inside this host. That is what makes a TURN server work on
# a machine with no port forwarding at all.
#
# Consequence: BOTH sides must be given a TURN URL they can actually reach, or
# there is no pair to win. signalling/ice.js therefore hands a frame the tailnet
# relay AND the public one. Do not "simplify" it back to tailnet-only.
#
# VERIFIED AGAINST coturn 4.7.0 (src/apps/relay/mainrelay.c, examples/etc/turnserver.conf).
# Three options named in ARCHITECTURE-PUBLIC.md section 3.4 are deliberately
# NOT used here, because the source says they are no-ops or unknown in 4.7.0:
#   * no-rfc5780                     DEPRECATED; RFC5780 NAT discovery is OFF by
#                                    default in 4.7.0 (`case NO_RFC5780: break;`).
#                                    Leaving it out gives the intended behaviour.
#   * response-origin-only-with-rfc5780
#                                    parsed but a no-op (`case ...: break;`).
#   * no-stun-backward-compatibility does not exist in 4.7.0 (the flag is the
#                                    positive `stun-backward-compatibility`, off
#                                    by default). An unknown key only produces a
#                                    "Bad configuration format" warning, but a
#                                    warning that is logged forever is a warning
#                                    people learn to ignore.
# The security posture is unchanged: both features are already off by default.
# ---------------------------------------------------------------------------

# TURN listener port for plain UDP and TCP.
listening-port=3478

# Bind ONLY these two addresses. This container runs with network_mode: host,
# so a default (0.0.0.0) bind would put a TURN server on the home LAN and on
# any other interface this box ever grows. Both entries are load-bearing:
#   127.0.0.1        the target of `tailscale funnel --tls-terminated-tcp=10000`
#   ${TS_TAILNET_IP} the address the frames dial, and the source of relay ports
listening-ip=127.0.0.1
listening-ip=${TS_TAILNET_IP}

# Relay allocations live on the tailnet address so that the frames, which are
# tailnet nodes, can reach them directly. This is the whole trick.
relay-ip=${TS_TAILNET_IP}

# No external-ip mapping on purpose. Advertising the home router's public IPv4
# would only produce candidates that nothing can reach: there is no port
# forwarding and there will not be one.
#
# (The upstream Docker image's default CMD appends --external-ip=$(detect-external-ip).
# docker-compose.turn.yml overrides the CMD precisely to avoid that.)

# UDP port range for relay endpoints, on the tailnet interface only. 100 ports
# is roughly 50 simultaneous allocations - far more than three people need, and
# small enough to be auditable. Nothing has to be opened in any firewall for
# these; they only ever receive traffic from 100.64.0.0/10.
min-port=49160
max-port=49260

# --- Authentication --------------------------------------------------------
# Ephemeral credentials, a.k.a. the "TURN REST API" scheme
# (draft-uberti-behave-turn-rest-00). The signalling server mints
#     username = "<unix-expiry>:<roster-peer-id>"
#     password = base64(HMAC-SHA1(static-auth-secret, username))
# from the same secret; see signalling/ice.js. There are no static users, so
# there is no user list to maintain and a leaked credential dies by itself.
use-auth-secret
static-auth-secret=${TURN_STATIC_AUTH_SECRET}

# The realm is echoed to clients and appears in logs. It is not a secret and it
# does not have to resolve, but using the real hostname keeps logs readable.
realm=${TURN_REALM}

# --- Hardening -------------------------------------------------------------
# The telnet CLI listens on 127.0.0.1:5766 with an EMPTY password by default,
# and network_mode: host means that would be a real open port on this machine.
no-cli
# Same reasoning for the web admin interface: it is off by default in 4.7.0 and
# it stays off. (Do not add web-admin here "for convenience".)

# tailscaled owns TLS. coturn must never listen for TLS/DTLS itself: it has no
# certificate, and a self-signed one would be rejected by every browser.
no-tls
no-dtls

# Refuse to relay to broadcast/multicast destinations (224.0.0.0+, FFXX::).
no-multicast-peers

# Do not advertise the exact coturn build in the SOFTWARE attribute.
# (Spelled the deprecated way on purpose: `software-attribute` exists in 4.7.0
# but not in the 4.6.x images someone might roll back to, and the deprecated
# name is still mapped in both.)
no-software-attribute

# --- Peer access control ---------------------------------------------------
# THE most important lines in this file. Without them, anyone holding a valid
# 12-hour credential can use this relay to reach the home LAN, to port-scan
# 127.0.0.1 (where Immich lives), or to launder traffic to the internet.
#
# coturn's semantics, from its own docs: "If an ip address is specified as both
# allowed and denied, then the ip address is considered to be allowed." The
# default for an address in NEITHER list is ALLOWED.
#
# HISTORY - READ THIS BEFORE TIGHTENING IT AGAIN.
# This used to deny 0.0.0.0/0 and allow back only 100.64.0.0/10, on the
# assumption that every party to a call is a tailnet node. That assumption died
# the moment the family phones went public-only (no Tailscale on their phones,
# by explicit requirement). A phone on mobile data has nothing but public
# candidates, so every relay pair involving it was answered with 403 and the
# call failed ICE about five seconds after the frame answered. Verified against
# the live server with a TURN probe over the public Funnel path:
#     permission 8.8.8.8       -> DENIED (403)
#     permission 100.64.0.1    -> ALLOWED
#
# What actually needed protecting was never "the internet" - it was this host
# and the home LAN behind it. A relay target on 127.0.0.0/8 could port-scan
# Immich and the signalling server; one on 192.168.0.0/16 could reach the home
# network. Those are denied below and must stay denied. The public internet is
# allowed, which is what every TURN deployment does; the exposure is bounded by
# ephemeral 12-hour credentials that only the four whitelisted accounts and the
# frames can mint, plus the quotas further down.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=224.0.0.0-255.255.255.255
# The tailnet sits inside 100.64.0.0/10 and is where relay-ip itself lives, so
# it must be allowed for relay-to-relay forwarding between two allocations on
# this same server. It is not denied above, but say it explicitly: this line is
# load-bearing and a future deny-all edit must not silently remove it.
allowed-peer-ip=100.64.0.0-100.127.255.255
# IPv6: deny loopback plus the private and link-local prefixes, leave global
# IPv6 usable for the same reason as IPv4 above.
#
# DO NOT write this as a single low range such as
#     denied-peer-ip=::-::ffff:ffff:ffff:ffff:ffff:ffff
# coturn holds every peer address as IPv6 and an IPv4 peer becomes the
# IPv4-mapped ::ffff:a.b.c.d, which falls INSIDE that range - so a rule meant
# for loopback silently denied all of IPv4 and every call failed exactly as
# before. coturn says so plainly when it happens:
#     ERROR: A peer IP 8.8.8.8 denied in the range: ::-::ffff:ffff:...
denied-peer-ip=::1-::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Note on loopback: coturn 4.7.0 denies peers on 127.x.x.x and ::1 unless
# allow-loopback-peers is set. It is not set here and must never be.
#
# Note on IPv6 peers: the frames are reached over their tailnet IPv4, so no
# IPv6 range is allowed back. If Tailscale IPv6 (fd7a:115c:a1e0::/48) is ever
# wanted as a relay target, add exactly that prefix - never a wider one.

# --- Quotas ----------------------------------------------------------------
# Everything arriving through Funnel appears to come from 127.0.0.1, so
# per-IP limiting is meaningless here. These are global backstops that cap the
# damage from a stolen credential rather than preventing its use.
#   user-quota  : concurrent allocations per credential ("user")
#   total-quota : concurrent allocations across the whole server
#   max-bps     : per-session ceiling in BYTES per second, with the input and
#                 output streams counted separately (coturn's own wording:
#                 "Max bytes-per-second bandwidth a TURN session is allowed to
#                 handle ... anything above that limit will be dropped or
#                 temporarily suppressed").
#
#                 ARCHITECTURE-PUBLIC.md section 3.4 writes 1500000 with a
#                 "1.5 Mbit/s" rationale - that reading is wrong, the unit is
#                 bytes, so 1500000 would be 12 Mbit/s. Corrected here to
#                 500000 B/s = 4 Mbit/s per direction: still roughly 6x the
#                 640 kbps a capped 1:1 call actually uses, so it can never
#                 degrade a real call, while remaining a hard ceiling.
#                 Raise it only if getStats() shows sustained clipping.
user-quota=12
total-quota=48
max-bps=500000

# Nonce lifetime. The default is 600s; stated explicitly so that a future
# reader does not have to guess.
stale-nonce=600

# --- Process ---------------------------------------------------------------
# The container runs as uid 1000 (see docker-compose.turn.yml), which cannot
# write /var/run. /var/tmp is a tmpfs mounted by compose.
pidfile=/var/tmp/turnserver.pid

# --- Logging ---------------------------------------------------------------
# Log to stdout so `docker logs frameo-coturn` is the single place to look, and
# so the json-file driver's rotation caps growth.
log-file=stdout
simple-log
# Explicitly DO NOT suppress stdout logging. coturn treats a missing value as
# "true", so the "=false" here is required, not decorative.
no-stdout-log=false

# NEVER add `verbose` or `Verbose` in production: they print credentials and
# session keys into the container log.
